name: Bug report
description: A wrong anchor, a heading that is missed or listed by mistake, or a CLI problem
labels: [bug]
body:
  - type: textarea
    id: markdown
    attributes:
      label: Markdown
      description: The smallest piece of Markdown that shows the problem.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran and the TOC (or error) you got.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: For anchors, the ID GitHub actually gives the heading (hover the heading's link icon on GitHub) is the best evidence.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: md-toc version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: 'Node 22.12, Ubuntu 24.04'
    validations:
      required: true
