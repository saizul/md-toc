# Copy to .github/workflows/docs.yml in your repository.
name: Docs

on:
  pull_request:
    paths: ["**/*.md"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: saizul/md-toc@v0.1.0
        with:
          files: |
            README.md
            docs/**/*.md
          max-depth: "3"
